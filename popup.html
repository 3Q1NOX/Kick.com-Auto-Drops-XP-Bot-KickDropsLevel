<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kick Drops & Level</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="wrap">
    <header>
      <img src="../icons/gear-32.png" alt="">
      <h1>Drops & Level</h1>
      <span class="ver">v1.0.0</span>
    </header>
    <section>
      <h2>Drops</h2>
      <label><span>Drops Farm</span><input type="checkbox" id="drops_enabled"></label>
      <label><span>Otomatik claim</span><input type="checkbox" id="drops_auto_claim"></label>
      <label><span>HUD göster</span><input type="checkbox" id="drops_hud"></label>
    </section>
    <section>
      <h2>Level</h2>
      <label><span>Level Bot</span><input type="checkbox" id="level_bot"></label>
      <label><span>Anti-stuck</span><input type="checkbox" id="anti_stuck"></label>
      <label><span>Sekmeyi aktif tut</span><input type="checkbox" id="bg_watch"></label>
      <label><span>Takılma onarıcı</span><input type="checkbox" id="stall_guard"></label>
      <label><span>160p (düşük kalite)</span><input type="checkbox" id="quality_160"></label>
    </section>
    <p class="hint">Kick sayfasında sağ alttaki <strong>DL</strong> butonundan detaylı panel açılır. Kampanya seçimi oradan yapılır.</p>
    <p class="disclaimer">Resmi olmayan eklenti. Risk size aittir.</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
